    <style id="km-authoritative-mobile-catalog-fix">

/* =========================================================
   KAMAGERE MART — AUTHORITATIVE MOBILE PRODUCT GRID
   Must remain the final style block on customer and admin pages.
   ========================================================= */
@media screen and (max-width: 640px) {
  html body .catalog-grid {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    grid-auto-flow: row;
    align-items: stretch;
    gap: 7px !important;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    margin-left: 0;
    margin-right: 0;
    padding: 6px 0 12px !important;
    box-sizing: border-box;
  }

  html body .catalog-grid > .product-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    width: 100%;
    max-width: 100%;
    margin: 0;
    border-radius: 10px;
    transform: none !important;
    transition: box-shadow .18s ease, border-color .18s ease;
    box-sizing: border-box;
  }

  html body .catalog-grid > .product-card:hover,
  html body .catalog-grid > .product-card:focus-within {
    transform: none !important;
  }

  html body .catalog-grid .product-image {
    flex: 0 0 auto;
    height: clamp(72px, 21vw, 94px) !important;
    min-height: 0 !important;
    width: 100%;
    overflow: hidden;
  }

  html body .catalog-grid .product-image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain !important;
    padding: 5px !important;
    box-sizing: border-box;
  }

  html body .catalog-grid .discount-badge {
    top: 4px;
    left: 4px;
    padding: 3px 4px;
    font-size: 9px;
    line-height: 1.05;
    white-space: nowrap;
  }

  html body .catalog-grid .sold-out-ribbon {
    top: 4px;
    right: 4px;
    padding: 3px 4px;
    font-size: 8px;
  }

  html body .catalog-grid .product-body {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    padding: 6px !important;
    gap: 0;
    box-sizing: border-box;
  }

  html body .catalog-grid .product-category {
    margin: 0 0 3px !important;
    font-size: 9px !important;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  html body .catalog-grid .product-title {
    margin: 0 0 5px !important;
    min-height: 0 !important;
    font-size: 11px !important;
    line-height: 1.2 !important;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
  }

  html body .catalog-grid .product-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 2px 4px;
    margin: 0 0 5px !important;
    min-width: 0;
  }

  html body .catalog-grid .product-price {
    font-size: 12px !important;
    line-height: 1.15;
    font-weight: 800;
  }

  html body .catalog-grid .old-price,
  html body .catalog-grid .item-unit {
    font-size: 9px !important;
    line-height: 1.15;
  }

  html body .catalog-grid .item-unit {
    white-space: nowrap;
  }

  html body .catalog-grid .product-description {
    display: none !important;
    height: 0 !important;
    min-height: 0 !important;
    margin: 0 !important;

    min-width: 0;

  }

  }

    <script>
      // Hide the loading screen once the page is ready (shown at least 1.6 s)
      (function () {
        var start = Date.now();
        function hide() {
          var el = document.getElementById('splash');
          if (!el) return;
          var wait = Math.max(0, 1600 - (Date.now() - start));
          setTimeout(function () {
            el.classList.add('hide');
            setTimeout(function () { el.remove(); }, 650);
          }, wait);
        }
        if (document.readyState === 'complete') hide();
        else window.addEventListener('load', hide);
      })();
    </script>
